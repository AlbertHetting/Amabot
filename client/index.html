<!doctype html>
<html lang="en">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap"
      rel="stylesheet"
    />

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AMA-bot Albert</title>
    <link rel="stylesheet" href="./assets/styles/styles.css" />
  </head>

  <body>
    <!-- Content -->
    <section class="MainBox">
      <section class="MainBoxFlexer">
        <section classn="InnerBox">
          <h1>Chat with my clone!</h1>
        </section>

        <h2>Spørgsmål fordelt på emner</h2>
        <ul class="Categories">
          <li>Navn:</li>
          <li>Bosted:</li>
          <li>Fritid:</li>
          <li>Kæledyr:</li>
        </ul>

        <section class="AskingBox">
          <form action="/ask" method="POST" class="Submitter">
            <input
              id="question"
              name="question"
              type="text"
              placeholder="Ask me anything!"
            />
            <button type="submit" class="SubmitterButton">Indsend</button>
            <button type="button" id="RemoverButton">Ryd beskeder</button>
          </form>

          <section class="TextChat">
            <div>
              <p role="alert"></p>
            </div>

            <article class="messageType">
              <p></p>
            </article>
          </section>
        </section>
      </section>
    </section>
    <script src="app.js" defer></script>
  </body>
</html>
